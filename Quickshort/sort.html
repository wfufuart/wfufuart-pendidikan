<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="stylequicksort">

    <title>visualisasi Quicksort!</title>
  </head>
  <body>
    <div class="container">
      <h2>Demo QuickSort</h2>
      <p>Data Awal: <span id="awal">[5, 3, 8, 4, 1, 2]</span></p>
      <button onclick="jalankanSort()">Urutkan Sekarang</button>
      <p>Hasil:</p>
      <div id="hasil">-</div>
    </div>



    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
      function quickSort(array) {
        if (array.length <= 1) {
            return array;
        }

        let pivot = array[0];
        let left = [];
        let right = [];

        // Dimulai dari indeks 1 agar tidak membandingkan pivot dengan dirinya sendiri
        for (let i = 1; i < array.length; i++) {
            if (array[i] < pivot) {
                left.push(array[i]);
            } else {
                right.push(array[i]);
            }
        }

        return [...quickSort(left), pivot, ...quickSort(right)];
      }

      function jalankanSort() {
        const data = [5, 3, 8, 4, 1, 2];
        const hasilUrut = quickSort(data);
        document.getElementById('hasil').innerText = JSON.stringify(hasilUrut);
      }
    </script>
  </body>
</html>
